<div class="login-screen">
  <div class="login-card">
    <h1>Lista de Mercado M y E</h1>
    <p class="subtitle">Inicia sesión para ver tus listas</p>

    @if (error()) {
      <p class="error-banner">{{ error() }}</p>
    }

    <form (submit)="$event.preventDefault(); submit()">
      <label>
        Email
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </label>

      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'Espera…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
