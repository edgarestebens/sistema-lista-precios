<div class="login-screen">
  <div class="login-card">
    <h1>Lista de Mercado M y E</h1>
    <p class="subtitle">
      {{ mode() === 'login' ? 'Inicia sesión para ver tus listas' : 'Crea tu cuenta' }}
    </p>

    <div class="tabs">
      <button
        type="button"
        [class.active]="mode() === 'login'"
        (click)="switchMode('login')"
      >
        Entrar
      </button>
      <button
        type="button"
        [class.active]="mode() === 'register'"
        (click)="switchMode('register')"
      >
        Registrarse
      </button>
    </div>

    @if (error()) {
      <p class="error-banner">{{ error() }}</p>
    }

    <form (submit)="$event.preventDefault(); submit()">
      @if (mode() === 'register') {
        <label>
          Nombre
          <input type="text" [(ngModel)]="fullName" name="fullName" autocomplete="name" />
        </label>
      }

      <label>
        Email
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
        />
      </label>

      <label>
        Contraseña
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="{{ mode() === 'login' ? 'current-password' : 'new-password' }}"
          required
        />
      </label>

      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'Espera…' : mode() === 'login' ? 'Entrar' : 'Crear cuenta' }}
      </button>
    </form>
  </div>
</div>
